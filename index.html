<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1220" />
    <meta name="description" content="Qubia Craft — Genera publicaciones para Instagram con IA, adaptadas a tu negocio" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Al instalarla en el móvil: pantalla completa, sin barra del navegador -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Qubia Craft" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="format-detection" content="telephone=no" />
    <title>Qubia Craft</title>
    <!-- Pantalla de entrada: va aquí (no en React) para que se vea al instante -->
    <style>
      html, body { background: #0a1220; }
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: radial-gradient(120% 80% at 50% 38%, #12233d 0%, #0a1220 62%); color: #eef1f6;
        font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; transition: opacity .45s ease, transform .45s ease; }
      #splash.hide { opacity: 0; transform: scale(1.04); pointer-events: none; }
      .sp-stage { position: relative; width: 168px; height: 168px; display: grid; place-items: center; }
      .sp-glow { position: absolute; inset: 14%; border-radius: 50%; background: radial-gradient(circle, rgba(198,151,88,.55), rgba(198,151,88,0) 70%); filter: blur(10px); opacity: 0; animation: sp-glow 2.4s ease-in-out .5s infinite; }
      .sp-orbits { position: absolute; inset: -18px; width: calc(100% + 36px); height: calc(100% + 36px); overflow: visible; }
      .sp-orbits ellipse { fill: none; stroke: #c69758; stroke-width: 1; stroke-linecap: round; opacity: .55; stroke-dasharray: 520; stroke-dashoffset: 520; animation: sp-draw 1.2s cubic-bezier(.6,.1,.2,1) forwards; }
      .sp-orbits ellipse.o2 { stroke: #17c3c6; opacity: .4; animation-delay: .15s; }
      .sp-orbits .sp-dot { fill: #17c3c6; opacity: 0; animation: sp-in .3s ease 1s forwards; filter: drop-shadow(0 0 4px #17c3c6); }
      .sp-logo { position: relative; width: 132px; height: 132px; object-fit: contain; opacity: 0; transform: scale(.55) rotate(-28deg); filter: blur(6px);
        animation: sp-logo .95s cubic-bezier(.2,.8,.2,1) .1s forwards, sp-breathe 3s ease-in-out 1.1s infinite; }
      .sp-name { font-size: 26px; font-weight: 300; letter-spacing: .5px; opacity: 0; transform: translateY(8px); animation: sp-up .6s ease .55s forwards; }
      .sp-name b { font-weight: 700; color: #17c3c6; }
      .sp-tag { margin-top: -10px; font-size: 12px; letter-spacing: 2.4px; text-transform: uppercase; color: #93a4bd; opacity: 0; animation: sp-up .6s ease .75s forwards; }
      .sp-bar { width: 120px; height: 2px; border-radius: 2px; background: rgba(198,151,88,.15); overflow: hidden; opacity: 0; animation: sp-in .4s ease .9s forwards; }
      .sp-bar i { display: block; width: 40%; height: 100%; border-radius: 2px; background: linear-gradient(90deg, transparent, #c69758, transparent); animation: sp-bar 1.1s ease-in-out infinite; }
      @keyframes sp-logo { to { opacity: 1; transform: none; filter: none; } }
      @keyframes sp-breathe { 50% { transform: scale(1.035); } }
      @keyframes sp-glow { 0%, 100% { opacity: .35; transform: scale(.92); } 50% { opacity: .8; transform: scale(1.06); } }
      @keyframes sp-draw { to { stroke-dashoffset: 0; } }
      @keyframes sp-up { to { opacity: 1; transform: none; } }
      @keyframes sp-in { to { opacity: 1; } }
      @keyframes sp-bar { from { transform: translateX(-110%); } to { transform: translateX(260%); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash *::before { animation: none !important; opacity: 1 !important; transform: none !important; filter: none !important; stroke-dashoffset: 0 !important; }
        .sp-bar { display: none; }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <div class="sp-stage">
        <div class="sp-glow"></div>
        <svg class="sp-orbits" viewBox="0 0 204 204">
          <ellipse class="o1" cx="102" cy="102" rx="98" ry="34" transform="rotate(-32 102 102)" />
          <ellipse class="o2" cx="102" cy="102" rx="98" ry="34" transform="rotate(38 102 102)" />
          <circle class="sp-dot" r="3">
            <animateMotion dur="2.6s" repeatCount="indefinite" begin="1s" path="M 18.9 154 A 98 34 -32 1 1 185.1 50 A 98 34 -32 1 1 18.9 154" />
          </circle>
        </svg>
        <img src="/splash-logo.png" alt="" class="sp-logo" />
      </div>
      <div class="sp-name">Qubia <b>Craft</b></div>
      <div class="sp-tag">Tus fotos · Tu voz</div>
      <div class="sp-bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
